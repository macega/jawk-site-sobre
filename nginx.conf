server {
    listen 80;
    server_name jawk.com.br www.jawk.com.br;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # /projetos não tem página própria: a lista fica na seção Projetos do início
    location = /projetos {
        return 301 /#projetos;
    }

    # Aceita /curriculo e /curriculo.html; página inexistente devolve 404 de verdade
    location / {
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Cache para arquivos estáticos (add_header aqui anula os do server, por isso o include)
    location ~* \.(css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    error_page 404 /404.html;
}
