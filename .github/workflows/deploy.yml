name: Build & Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build e Push para o GitHub Container Registry
    runs-on: ubuntu-latest

    # O GITHUB_TOKEN precisa de permissão para publicar no ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # O Watchtower no servidor detecta a imagem nova e recria o container
      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/macega/jawk-site-sobre:latest
            ghcr.io/macega/jawk-site-sobre:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
